spring:
  application:
    name: sgac-backend
  datasource:
    url: "jdbc:sqlserver://localhost:14333;databaseName=SGAC_DB;encrypt=true;trustServerCertificate=true"
    username: sa
    password: ${MSSQL_SA_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: 8080
# Somente desenvolvimento local. Em producao, usar certificado e usuario dedicado ao banco.
